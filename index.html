<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e32">
<title>حسابداری نمایندگی آسیا</title>
<style>
:root{--navy:#101e32;--gold:#d7b46a;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:var(--bg);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;color:#182334}
.panel{width:min(100%,420px);padding:30px 24px;background:var(--navy);color:#fff;border-radius:24px;text-align:center;box-shadow:0 18px 55px #101e3225}.mark{width:66px;height:66px;border:1px solid #d7b46a88;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;color:var(--gold);font-size:30px}h1{font-size:22px;margin:0 0 8px;color:var(--gold)}.sub{color:#d4dbe5;font-size:14px;margin:0 0 28px}label{display:block;text-align:right;font-size:14px;margin-bottom:10px;color:#e5eaf0}input{width:100%;height:58px;border:1px solid #64748b;border-radius:13px;background:#fff;color:#101e32;text-align:center;font-size:28px;letter-spacing:12px;padding:0 12px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d7b46a33}button{width:100%;height:52px;border:0;border-radius:13px;background:var(--gold);color:#101e32;font-weight:bold;font-size:16px;margin-top:18px;cursor:pointer}button:disabled{opacity:.55}.hint{min-height:24px;color:#ffd4d4;font-size:13px;margin-top:15px}.secure{color:#b9c4d2;font-size:12px;margin-top:22px}.home{width:min(100%,520px);background:#fff;border-radius:22px;padding:26px;box-shadow:0 14px 45px #101e3214}.home h2{color:var(--navy)}.home button{background:var(--navy);color:#fff}[hidden]{display:none!important}
</style></head>
<body>
<main id="login" class="panel"><div class="mark" aria-hidden="true">◆</div><h1>حسابداری نمایندگی آسیا</h1><p class="sub">ورود مدیر سیستم</p>
<form id="loginForm"><label for="pin">کد امنیتی شش‌رقمی را وارد کنید</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" maxlength="6" minlength="6" required aria-label="کد امنیتی شش رقمی"><button id="submit" type="submit">تأیید و ورود</button></form>
<div id="message" class="hint" role="alert"></div><div class="secure">دسترسی فقط پس از تأیید کد مدیر امکان‌پذیر است</div></main>
<main id="home" class="home" hidden><h2>حسابداری نمایندگی آسیا</h2><p id="welcome"></p><p>ورود موفق بود. بخش‌های حسابداری در مرحله بعد تکمیل می‌شوند.</p><button id="logout" type="button">قفل و خروج</button></main>
<script>
const login=document.getElementById('login'),home=document.getElementById('home'),pin=document.getElementById('pin'),message=document.getElementById('message'),submit=document.getElementById('submit');
async function checkSession(){try{const r=await fetch('/api/auth',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(r.ok&&d.authenticated){showHome(d.username);return}}catch(e){}showLogin()}
function showLogin(){home.hidden=true;login.hidden=false;pin.value='';}
function showHome(username){login.hidden=true;home.hidden=false;document.getElementById('welcome').textContent='خوش آمدید، '+(username||'مدیر')}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();message.textContent='';if(!/^[0-9]{6}$/.test(pin.value)){message.textContent='کد باید دقیقاً شش رقم باشد.';return}submit.disabled=true;submit.textContent='در حال بررسی...';try{const r=await fetch('/api/auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',pin:pin.value})});const d=await r.json();if(r.ok&&d.authenticated)showHome(d.username);else if(r.status===429)message.textContent='ورود موقتاً قفل شده است. بعداً دوباره تلاش کنید.';else{message.textContent='کد امنیتی نادرست است.';pin.value=''}}catch(err){message.textContent='ارتباط با سرور برقرار نشد. دوباره تلاش کنید.'}finally{submit.disabled=false;submit.textContent='تأیید و ورود'}});
document.getElementById('logout').addEventListener('click',async()=>{try{await fetch('/api/auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})})}finally{showLogin()}});
checkSession();
</script></body></html>
