<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101e32"><title>تنظیم قفل آسیا</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#f3f5f8;font-family:Tahoma,Arial;display:grid;place-items:center}.card{width:min(100%,430px);background:#101e32;color:white;border-radius:22px;padding:28px 22px;text-align:center}h2{color:#d7b46a}p{font-size:14px;line-height:2;color:#d4dbe5}label{display:block;text-align:right;margin:16px 0 8px}input{width:100%;height:52px;border-radius:11px;text-align:center;font-size:22px}button{width:100%;height:50px;border:0;border-radius:11px;background:#d7b46a;font-size:16px;margin-top:18px}.msg{color:#ffd2d2;min-height:25px}.code{direction:ltr;word-break:break-word;background:white;color:#101e32;padding:14px;border-radius:10px;font-weight:bold;letter-spacing:2px}a{color:#f1dba9}</style><main class="card"><h2>تنظیم قفل حسابداری آسیا</h2><p>کد ورود شش‌رقمی خود را تعیین کن. کد اضطراری بازیابی را یادداشت و در جای امن نگهداری کن.</p><form id="f"><label>کد ورود جدید</label><input id="p" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required><label>تکرار کد ورود</label><input id="c" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required><button id="b">ثبت کد و فعال‌سازی</button></form><div id="m" class="msg"></div><section id="done" hidden><p>این کد اضطراری فقط همین یک بار نمایش داده می‌شود. آن را یادداشت کن.</p><div id="code" class="code"></div><button id="copy">کپی کد اضطراری</button><p><a href="/">رفتن به صفحه ورود</a></p></section></main><script>
const token=location.hash.slice(1);history.replaceState(null,"",location.pathname);const f=document.getElementById("f"),m=document.getElementById("m"),b=document.getElementById("b");
f.onsubmit=async e=>{e.preventDefault();m.textContent="";const p=document.getElementById("p").value;if(!/^[0-9]{6}$/.test(p)||p!==document.getElementById("c").value){m.textContent="دو کد باید یکسان و شش‌رقمی باشند.";return}b.disabled=true;try{const r=await fetch("/api/recovery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"setup",setupToken:token,pin:p})});const d=await r.json();if(!r.ok)throw Error(d.error==="setup_already_completed"?"تنظیم اولیه قبلاً انجام شده است.":"لینک تنظیم نامعتبر است.");document.getElementById("code").textContent=d.recoveryCode;f.hidden=true;document.getElementById("done").hidden=false}catch(e){m.textContent=e.message}finally{b.disabled=false}};
document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(document.getElementById("code").textContent);
</script></main>
